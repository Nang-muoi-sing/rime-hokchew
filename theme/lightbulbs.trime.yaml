preset_keys:
  $Q: { send: q }
  $W: { send: w }
  $E: { send: e }
  $R: { send: r }
  $T: { send: t }
  $Y: { send: y }
  $U: { send: u }
  $I: { send: i }
  $O: { send: o }
  $P: { send: p }
  $A: { send: a }
  $S: { send: s }
  $D: { send: d }
  $F: { send: f }
  $G: { send: g }
  $H: { send: h }
  $J: { send: j }
  $K: { send: k }
  $L: { send: l }
  $Z: { send: z }
  $X: { send: x }
  $C: { send: c }
  $V: { send: v }
  $B: { send: b }
  $N: { send: n }
  $M: { send: m }
  $BackSpace:
    {
      label: "ic@backspace",
      repeatable: true,
      functional: false,
      slide_delete: true,
      send: BackSpace,
    }
  $Return: { label: enter_labels, functional: false, send: Return }
  $ReturnStatic:
    { label: "ic@keyboard_return", functional: false, send: Return }
  $Space:
    {
      repeatable: false,
      functional: false,
      slide_cursor: true,
      label: "ic@keyboard_space",
      send: space,
    }
  $ModeSwitch:
    {
      toggle: ascii_mode,
      functional: false,
      send: Mode_switch,
      states: ["ic@ideogram_cjk", "ic@alphabet_latin"],
    }
  $HideKeyboard: { send: BACK }
  $ZenkakuHankaku:
    { toggle: full_shape, send: Mode_switch, states: [半角, 全角] }
  $Cut: { label: 剪切, functional: false, send: Control+x }
  $Copy: { label: 复制, functional: false, send: Control+c }
  $Paste: { label: 粘贴, functional: false, send: Control+v }
  $Menu: { label: 菜单, send: function, command: menu_keyboard }
  $SchemeSettings: { label: "方案", functional: false, send: Menu }
  $KeyboardEmoji0:
    {
      label: "ic@arrow_up_bold_outline",
      functional: false,
      send: Eisu_toggle,
      select: emoji_0,
    }
  $KeyboardEmoji1:
    {
      label: "ic@arrow_down_bold_outline",
      functional: false,
      send: Eisu_toggle,
      select: emoji_1,
    }
  $KeyboardNumber:
    {
      label: "ic@numeric",
      functional: false,
      send: Eisu_toggle,
      select: number,
    }
  $KeyboardSymbol0:
    {
      label: "ic@symbol",
      functional: false,
      send: Eisu_toggle,
      select: symbol_0,
    }
  $KeyboardSymbol0Alter:
    {
      label: "ic@arrow_up_bold_outline",
      functional: false,
      send: Eisu_toggle,
      select: symbol_0,
    }
  $KeyboardSymbol1:
    {
      label: "ic@arrow_down_bold_outline",
      functional: false,
      send: Eisu_toggle,
      select: symbol_1,
    }
  $KeyboardDefault:
    {
      label: "ic@keyboard_backspace",
      functional: false,
      send: Eisu_toggle,
      select: default,
    }
  $KeyboardEditor:
    {
      label: "ic@keyboard_backspace",
      functional: false,
      send: Eisu_toggle,
      select: editor,
    }
  $Shift: { label: "ic@upload_outline", functional: false, send: Shift_L }
  $ShiftLock: { label: " ", functional: false, send: Shift_L, shift_lock: long }
  $MoveLeft: { label: "ic@chevron_left", functional: false, send: Left }
  $MoveRight: { label: "ic@chevron_right", functional: false, send: Right }
  $MoveUp: { label: "ic@chevron_up", functional: false, send: Up }
  $MoveDown: { label: "ic@chevron_down", functional: false, send: Down }
  $Redo: { label: "ic@redo", functional: false, send: Control+Shift+z }
  $Undo: { label: "ic@undo", functional: false, send: Control+z }
  $Escape: { label: "ic@keyboard_esc", functional: false, send: Escape }
  $SelectAll: { label: "ic@select_all", functional: false, send: Control+a }
  $ClipboardWindow:
    { label: "剪贴板", send: function, command: "clipboard_window" }
