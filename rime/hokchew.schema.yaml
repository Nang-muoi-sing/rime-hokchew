# Rime schema
# encoding: UTF-8 w/o BOM

schema:
  schema_id: hokchew
  name: 榕拼輸入法：漢字
  version: "2026.07.08"
  author:
    - 負責：ZySieng <zysieng@gmail.com>
    - 程序：ztl8702、ZySieng

  description: 輸入方案詳見《榕拼方案规范文档分册：福州城里》（https://jcnf40n3hvft.feishu.cn/wiki/Xs7HwuxwUiV4cmkzrrPck9uTnne）。
  dependencies:
    - hokchew_pinyin
    - hokchew_phrases

switches:
  - name: ascii_mode
    reset: 0
    states: [汉字, 字母]
  - name: full_shape
    states: [半角, 全角]
  - name: simplification
    states: [繁體, 简体]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@pinyin
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - script_translator@pinyin
  filters:
    - reverse_lookup_filter@yngping_char_comment
    - reverse_lookup_filter@yngping_phrase_comment
    - lua_filter@*yngping_fallback_comment
    - lua_filter@*yngping_comment_format
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # 忽略声调 及 {}
    - xform/^\{?([a-z]+)([0-5]*)\}?$/$1/
    # 以首字母爲多字母音節碼的縮寫
    - abbrev/^([gkhlnmbpdtzcs]|ng)[aoeiuy]+(ng|h|k)?$/$1/
    - abbrev/^([lnm]|ng).+$/$1/

    # ——————模糊音——————
    # 普通話拼音模糊音
    - derive/y/v/
    - derive/au/ao/
    - derive/yo/ue/
    - derive/^yo/yue/
    - derive/^yong/yuan/
    - derive/ieng/ian/
    - derive/oung/ong/
    - derive/yng/yun/
    - derive/iau/yao/
    # 普通話拼音的零声母辅音
    - derive/^ia/ya/
    - derive/^i/yi/
    - derive/^iu/you/
    - derive/^y/yu/
    - derive/^ie/ye/
    # 鼻音韵尾简化
    - derive/ang/an/
    - derive/ing/in/
    - derive/yng/vn/
    # 戚林八音音系
    - derive/eing/eng/
    - derive/yo/io/
    - derive/iu/ieu/
    - derive/ui/uoi/
    - derive/eoy/oi/
    - derive/ooy/oi/
    # 入聲模糊音
    - derive/^(.+)[hk]$/$1/
    - derive/^(.+)[hk]$/$1h/
    - derive/^(.+)[hk]$/$1k/
    # 类化音模糊音（大部分是）
    - derive/^ui/wei/
    - derive/w/b/
    - derive/^ua/wa/
    - derive/^uai/wai/
    - derive/^u/wu/
    - derive/^uo/wo/
    - derive/j/z/
    - derive/j/c/
    - derive/zi/ji/
    - derive/ci/qi/
    - derive/si/xi/
    - derive/zy/ju/
    - derive/cy/qu/
    - derive/sy/xu/
    - derive/nj/z/
    - derive/nj/c/
    - derive/nj/j/
    - derive/nj/n/
    # oo的模糊音
    - derive/oo/o/
    - derive/ooung/aung/
    - derive/oouk/auk/
    - derive/ooyng/ayng/
    - derive/ooyk/ayk/
    - derive/ooy/eoy/
    # 泥來混
    - derive/^[ln](.*)$/l$1/
    - derive/^[nl](.*)$/n$1/
    # 新老派 城乡 口音差异
    - derive/ooy/uai/
    - derive/yo/yeo/
    - derive/za/zia/
    - derive/ca/cia/
    - derive/ja/ia/
    # 新老派、城乡口音差异的普通话拼音模糊音
    - derive/za/jia/
    - derive/ca/qia/
    - derive/ja/ya/
    - derive/nja/ya/
    - derive/nja/ia/
    # 关于eo的模糊音
    - derive/eoyng/eong/
    - derive/eoyng/oyng/
    - derive/eoyng/eung/
    - derive/eoyng/oeyng/
    - derive/eoyng/oyeng/
    - derive/eoyng/eyong/
    - derive/eo/oe/
translator:
  dictionary: hokchew
  spelling_hints: 12
  enable_sentence: true
  enable_encoder: true
  preedit_format:
    # 便捷鍵還原
    - xform/f/ng/

pinyin:
  tag: pinyin
  dictionary: hokchew_pinyin
  enable_sentence: true
  enable_user_dict: false
  prefix: "`"
  suffix: "'"
  tips: 〔普通话拼音反查〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

yngping_phrase_comment:
  tags: [pinyin]
  dictionary: hokchew_phrases
  overwrite_comment: true

yngping_char_comment:
  tags: [pinyin]
  dictionary: hokchew
  overwrite_comment: true

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings/+:
    - { when: always, toggle: simplification, accept: Control+Shift+8 }

recognizer:
  import_preset: default
  patterns:
    pinyin: "`[a-z]*'?$"

simplifier:
  opencc_config: t2s.json
  option_name: simplification
  tips: none

style:
  font_face: "Times New Roman"
  font_point: 16
  comment_font_face: "Times New Roman"
