name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMA_DIR: rime
  OUTPUT_DIR: output
  TRIME_REF: v3.3.11
  TRIME_APP_ID: com.seedict.trime
  BUILD_ABI: arm64-v8a

jobs:
  build-rime-zip:
    name: Build Rime schema zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Build Rime schema zip
        run: |
          set -euo pipefail
          mkdir -p output
          (
            cd rime
            zip -r ../output/rime-hokchew.zip .
          )

      - name: Upload Rime schema zip
        uses: actions/upload-artifact@v4
        with:
          name: rime-hokchew.zip
          path: output/rime-hokchew.zip
          if-no-files-found: error

  build-bim-zip:
    name: Build BIM schema zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4

      - name: Install dependencies
        run: pdm sync -G default

      - name: Build BIM schema zip
        run: |
          set -euo pipefail
          mkdir -p output/bim-hokchew
          cp -R bim/. output/bim-hokchew/
          pdm run python scripts/build_bim.py -s rime -o output/bim-hokchew
          (
            cd output
            zip -r bim-hokchew.zip bim-hokchew
          )

      - name: Upload BIM schema zip
        uses: actions/upload-artifact@v4
        with:
          name: bim-hokchew.zip
          path: output/bim-hokchew.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4

      - name: Install dependencies
        run: pdm sync -G default

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install 7-Zip
        run: choco install 7zip -y

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          bash .ci/package-windows.sh

      - name: Locate Windows installer
        id: windows-artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find output -maxdepth 1 -type f -name 'rime-hokchew-weasel-*.exe' | sort)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            printf 'Expected exactly one Windows installer, found %s\n' "${#artifacts[@]}" >&2
            printf '%s\n' "${artifacts[@]}" >&2
            exit 1
          fi
          printf 'artifact_path=%s\n' "${artifacts[0]}" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$(basename "${artifacts[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.windows-artifact.outputs.artifact_name }}
          path: ${{ steps.windows-artifact.outputs.artifact_path }}
          if-no-files-found: error

  build-macos:
    name: Build macOS package
    runs-on: macos-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4

      - name: Install dependencies
        run: pdm sync -G default

      - name: Build macOS package
        run: |
          set -euo pipefail
          bash .ci/package-mac.sh

      - name: Locate macOS package
        id: macos-artifact
        run: |
          set -euo pipefail
          artifacts=(output/rime-hokchew-squirrel-*.pkg)
          if [ "${#artifacts[@]}" -ne 1 ] || [ ! -f "${artifacts[0]}" ]; then
            printf 'Expected exactly one macOS package, found %s\n' "${#artifacts[@]}" >&2
            printf '%s\n' "${artifacts[@]}" >&2
            exit 1
          fi
          printf 'artifact_path=%s\n' "${artifacts[0]}" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$(basename "${artifacts[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.macos-artifact.outputs.artifact_name }}
          path: ${{ steps.macos-artifact.outputs.artifact_path }}
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.31.6"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          bash .ci/package-android.sh

      - name: Locate Android APK
        id: android-artifact
        run: |
          set -euo pipefail
          artifacts=(output/rime-hokchew-trime-*.apk)
          if [ "${#artifacts[@]}" -ne 1 ] || [ ! -f "${artifacts[0]}" ]; then
            printf 'Expected exactly one Android APK, found %s\n' "${#artifacts[@]}" >&2
            printf '%s\n' "${artifacts[@]}" >&2
            exit 1
          fi
          printf 'artifact_path=%s\n' "${artifacts[0]}" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$(basename "${artifacts[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.android-artifact.outputs.artifact_name }}
          path: ${{ steps.android-artifact.outputs.artifact_path }}
          if-no-files-found: error
