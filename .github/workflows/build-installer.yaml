name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMA_DIR: rime
  OUTPUT_DIR: output
  TRIME_REF: v3.3.11
  TRIME_APP_ID: com.seedict.trime
  BUILD_ABI: arm64-v8a

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4

      - name: Install dependencies
        run: pdm sync -G default

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install 7-Zip
        run: choco install 7zip -y

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          bash .ci/package-windows.sh

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: rime-hokchew-windows-installer
          path: output/rime-hokchew-weasel-*.exe

  build-macos:
    name: Build macOS package
    runs-on: macos-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4

      - name: Install dependencies
        run: pdm sync -G default

      - name: Build macOS package
        run: |
          set -euo pipefail
          bash .ci/package-mac.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: rime-hokchew-macos-package
          path: output/rime-hokchew-squirrel-*.pkg

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.31.6"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          bash .ci/package-android.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: rime-hokchew-android-apk
          path: output/rime-hokchew-trime-*.apk
